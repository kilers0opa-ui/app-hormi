name: DEBUG leagues (temporal)

on:
  workflow_dispatch:
    inputs:
      team_id:
        description: "team_id a inspeccionar"
        type: string
        required: true

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python debug_leagues.py --team "${{ inputs.team_id }}"
      - run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add debug_leagues_output.json
          git commit -m "debug: inspeccion temporal de /leagues [skip ci]"
          git pull --rebase origin main
          git push
