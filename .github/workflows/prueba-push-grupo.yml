name: Prueba de avisos unificados de la Selección - App Hormi

on:
  workflow_dispatch:

concurrency:
  group: hormi-prueba-push   # propio: no espera al motor ni lo estorba
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prueba:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: main   # siempre lo más nuevo (una corrida en cola, si no, usa la versión de cuando se encoló y repite alertas ya enviadas)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Mandar los push de prueba
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: python prueba_push_grupo.py
      - name: Subir resultado
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prueba_push.json
          git commit -m "chore: resultado de la prueba de push [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done

