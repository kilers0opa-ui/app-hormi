name: Resumen semanal - App Hormi

# Cada lunes 8:45 a.m. hora de México (14:45 UTC): "Jornada de la Legión" de la semana lunes-domingo que terminó.
on:
  schedule:
    - cron: "45 14 * * 1"
  workflow_dispatch:
    inputs:
      hasta:
        description: "Domingo de la semana a resumir (YYYY-MM-DD). Vacío = la semana pasada"
        type: string
        default: ""
      aviso:
        description: "Mandar el aviso a los celulares"
        type: boolean
        default: true

concurrency:
  group: hormi-chequeo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  semana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow numpy google-auth requests
      - name: Armar el resumen
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.hasta }}" ]; then ARGS="$ARGS --hasta ${{ inputs.hasta }}"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.aviso }}" != "true" ]; then ARGS="$ARGS --sin-aviso"; fi
          python hormi_semana.py $ARGS
      - name: Subir
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add semana.json semana || true
          git commit -m "chore: resumen semanal [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
