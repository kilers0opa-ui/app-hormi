name: Resumen semanal - App Hormi

# "Jornada de la Legión" de la semana lunes-domingo que terminó: cada lunes a las 9:00 a.m. hora de México.
# El cron de GitHub se retrasa (10-60 min) y a veces se salta corridas: por eso arranca 8:20 (espera hasta las
# 9:00 si llega antes) y hay corridas de respaldo 9:20, 10:20 y 12:20 que no hacen nada si ya salió el de la semana.
on:
  schedule:
    - cron: "20 14 * * 1"
    - cron: "20 15 * * 1"
    - cron: "20 16 * * 1"
    - cron: "20 18 * * 1"
  workflow_dispatch:
    inputs:
      hasta:
        description: "Domingo de la semana a resumir (YYYY-MM-DD). Vacío = la semana pasada"
        type: string
        default: ""
      aviso:
        description: "Mandar el aviso a los celulares"
        type: boolean
        default: true

concurrency:
  group: hormi-semana   # propio: compartir grupo con historial/tabla/convocatoria hacía que GitHub descartara la corrida del lunes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  semana:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install pillow numpy google-auth requests
      - name: Armar el resumen
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # ¿Ya salió el resumen de la semana pasada? (lo deja semana.json → "hasta" = domingo de ayer)
            DOMINGO=$(TZ=America/Mexico_City date -d "yesterday" +%F)
            HECHO=$(python -c "import json;print(json.load(open('semana.json')).get('hasta',''))" 2>/dev/null || true)
            if [ "$HECHO" = "$DOMINGO" ]; then echo "El resumen de esta semana ya salió."; exit 0; fi
            # Si el cron llegó antes de las 9:00 (hora de México), espera para que el aviso llegue a las 9.
            AHORA=$(date -u +%s); NUEVE=$(TZ=America/Mexico_City date -d "today 09:00" +%s)
            if [ "$AHORA" -lt "$NUEVE" ]; then echo "Esperando a las 9:00…"; sleep $((NUEVE - AHORA)); fi
          fi
          ARGS=""
          if [ -n "${{ inputs.hasta }}" ]; then ARGS="$ARGS --hasta ${{ inputs.hasta }}"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.aviso }}" != "true" ]; then ARGS="$ARGS --sin-aviso"; fi
          python hormi_semana.py $ARGS
      - name: Subir
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add semana.json semana || true
          git commit -m "chore: resumen semanal [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
