name: Diag DNS
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          {
          echo "== getent"; getent hosts v3.football.api-sports.io || echo FAIL
          echo "== dig sistema"; dig +short v3.football.api-sports.io || true
          echo "== dig 8.8.8.8"; dig +short @8.8.8.8 v3.football.api-sports.io || true
          echo "== dig 1.1.1.1"; dig +short @1.1.1.1 api-sports.io || true
          echo "== curl status"; curl -sS -m 15 -H "x-apisports-key: $K" https://v3.football.api-sports.io/status | head -c 600 || echo CURLFAIL
          echo; echo "== resolv.conf"; cat /etc/resolv.conf
          } > diag_dns.txt 2>&1
        env:
          K: ${{ secrets.APIFOOTBALL_KEY }}
      - run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diag_dns.txt
          git commit -m "chore: diag dns [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
