name: Tabla de posiciones - App Hormi

on:
  schedule:
    # Una vez al día, en horario distinto a Fase 3 (historial corre a las
    # 03:00 hora de México) para no juntar de golpe las peticiones de ambas.
    - cron: "0 12 * * *"   # 06:00 hora de México (UTC-6)
  workflow_dispatch:       # para poder correrlo manual desde la pestaña Actions
    inputs:
      jugador:
        description: "Limitar a un jugador (vacío = todos: armando, raul, quinones, mora, vasquez, gimenez, chavez, obed, fidalgo, huescas, montes, luis_chavez, fimbres, campillo, camberos, sandoval)"
        type: choice
        default: ""
        options:
          - ""
          - armando
          - raul
          - quinones
          - mora
          - vasquez
          - gimenez
          - chavez
          - obed
          - fidalgo
          - huescas
          - montes
          - luis_chavez
          - fimbres
          - campillo
          - camberos
          - sandoval

concurrency:
  group: hormi-chequeo   # comparte grupo con las demás fases (NO con el motor de alertas, que tiene el suyo: hormi-motor); el push reintenta con pull --rebase
  cancel-in-progress: false

permissions:
  contents: write   # necesario para que el workflow pueda hacer commit/push de team_standings.json

jobs:
  tabla:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main   # siempre lo más nuevo (una corrida en cola, si no, usa la versión de cuando se encoló y repite alertas ya enviadas)

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"

      - name: Actualizar tabla de posiciones (team_standings.json)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.jugador }}" ]; then
            ARGS="$ARGS --jugador ${{ inputs.jugador }}"
          fi
          python hormi_tabla.py $ARGS

      - name: Subir team_standings.json
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add team_standings.json escudos 2>/dev/null || git add team_standings.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiza tabla de posiciones (Fase 4) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          else
            echo "Sin cambios que subir."
          fi
