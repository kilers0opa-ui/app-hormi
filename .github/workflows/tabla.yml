name: Tabla de posiciones - App Hormi

on:
  schedule:
    # Una vez al día, en horario distinto a Fase 3 (historial corre a las
    # 03:00 hora de México) para no juntar de golpe las peticiones de ambas.
    - cron: "0 12 * * *"   # 06:00 hora de México (UTC-6)
  workflow_dispatch:       # para poder correrlo manual desde la pestaña Actions
    inputs:
      jugador:
        description: "Limitar a un jugador (vacío = todos: armando, raul, quinones, mora, vasquez, gimenez, chavez, obed, fidalgo, huescas)"
        type: choice
        default: ""
        options:
          - ""
          - armando
          - raul
          - quinones
          - mora
          - vasquez
          - gimenez
          - chavez
          - obed
          - fidalgo
          - huescas

concurrency:
  group: hormi-chequeo   # mismo grupo que las demás fases: nunca corren al mismo tiempo (evita choques de git push)
  cancel-in-progress: false

permissions:
  contents: write   # necesario para que el workflow pueda hacer commit/push de team_standings.json

jobs:
  tabla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Actualizar tabla de posiciones (team_standings.json)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.jugador }}" ]; then
            ARGS="$ARGS --jugador ${{ inputs.jugador }}"
          fi
          python hormi_tabla.py $ARGS

      - name: Subir team_standings.json
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add team_standings.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiza tabla de posiciones (Fase 4) [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "Sin cambios que subir."
          fi
