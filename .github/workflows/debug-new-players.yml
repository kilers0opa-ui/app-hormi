name: Debug temporal - nuevos jugadores

on:
  workflow_dispatch: {}

concurrency:
  group: hormi-chequeo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Debug
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python debug_new_players.py
      - name: Subir resultado
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add debug_output.json
          git commit -m "debug: inspeccion temporal nuevos jugadores [skip ci]" || echo "sin cambios"
          git pull --rebase origin main
          git push
