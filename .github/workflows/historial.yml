name: Historial de estadisticas - App Hormi

on:
  schedule:
    # Una vez al día. No compite con el chequeo de cada 5 min: gasta 1
    # petición de la API por cada año de "career_seasons" de cada jugador
    # (ver hormi_historial.py), así que una cadencia baja alcanza sin
    # pelearse por cuota con el plan (100 peticiones/día en el gratuito).
    - cron: "0 9 * * *"   # 03:00 hora de México (UTC-6)
  workflow_dispatch:       # para poder correrlo manual desde la pestaña Actions
    inputs:
      jugador:
        description: "Limitar a un jugador (vacío = todos: armando, raul, quinones, mora, vasquez, gimenez, chavez, obed, fidalgo, huescas, montes, luis_chavez, fimbres, campillo, camberos, sandoval)"
        type: choice
        default: ""
        options:
          - ""
          - armando
          - raul
          - quinones
          - mora
          - vasquez
          - gimenez
          - chavez
          - obed
          - fidalgo
          - huescas
          - montes
          - luis_chavez
          - fimbres
          - campillo
          - camberos
          - sandoval
      temporada:
        description: "Limitar a una sola temporada (vacío = todas las de career_seasons), útil para pruebas"
        type: string
        default: ""

concurrency:
  group: hormi-chequeo   # comparte grupo con fase1/tabla/transferencias (NO con el motor, que tiene el suyo: hormi-motor); el push reintenta con pull --rebase
  cancel-in-progress: false

permissions:
  contents: write   # necesario para que el workflow pueda hacer commit/push de player_stats.json
  actions: write    # al final lanza rachas.yml (hitos al día)

jobs:
  historial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: main   # siempre lo más nuevo (una corrida en cola, si no, usa la versión de cuando se encoló y repite alertas ya enviadas)

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"

      - name: Actualizar historial (player_stats.json)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.jugador }}" ]; then
            ARGS="$ARGS --jugador ${{ inputs.jugador }}"
          fi
          if [ -n "${{ inputs.temporada }}" ]; then
            ARGS="$ARGS --temporada ${{ inputs.temporada }}"
          fi
          python hormi_historial.py $ARGS

      - name: Subir player_stats.json
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add player_stats.json historial_pj_cache.json 2>/dev/null || git add player_stats.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiza historial de estadisticas (Fase 3) [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin main; then
                git push && break
              else
                # El motor de alertas también puede tocar player_stats.json (suma el partido recién
                # terminado). Esta fase recalcula todo desde la API, así que su versión gana.
                git rebase --abort
                cp player_stats.json /tmp/player_stats.json; cp historial_pj_cache.json /tmp/ 2>/dev/null || true
                git fetch origin main && git reset --hard origin/main
                cp /tmp/player_stats.json player_stats.json; cp /tmp/historial_pj_cache.json . 2>/dev/null || true
                git add player_stats.json; git add historial_pj_cache.json 2>/dev/null || true
                git commit -m "chore: actualiza historial de estadisticas (Fase 3) [skip ci]"
                git push && break
              fi
              sleep 5
            done
          else
            echo "Sin cambios que subir."
          fi
      - name: Rachas e hitos al día
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rachas.yml --ref main || true
