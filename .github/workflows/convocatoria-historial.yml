name: Reconstruir historial de convocatorias - App Hormi

on:
  workflow_dispatch:
    inputs:
      ver:
        description: "'si' = solo genera convocatorias_reconstruidas.json para revisar; 'no' = escribe el historial"
        default: "si"

concurrency:
  group: hormi-convocatoria-historial
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  historial:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Reconstruir
        run: |
          if [ "${{ inputs.ver }}" = "si" ]; then python hormi_convocatoria_historial.py --ver > historial_log.txt 2>&1 || true
          else python hormi_convocatoria_historial.py > historial_log.txt 2>&1 || true; fi
      - name: Subir
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in historial_log.txt hormi_convocatoria.json convocatorias_reconstruidas.json historial_dump.json; do [ -f "$f" ] && git add "$f"; done
          git commit -m "chore: historial de convocatorias [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
