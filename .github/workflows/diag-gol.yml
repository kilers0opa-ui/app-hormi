name: Diag gol - App Hormi

on:
  workflow_dispatch:

concurrency:
  group: hormi-diag-gol   # propio: no espera al motor ni lo estorba
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # siempre lo más nuevo (una corrida en cola, si no, usa la versión de cuando se encoló y repite alertas ya enviadas)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install google-auth requests
      - name: Mandar mensaje de prueba y guardar resultado
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python diag_gol.py
      - name: Subir resultado
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diag_gol.json
          git commit -m "chore: resultado del diagnóstico de push [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
