name: Fondos de pantalla - App Hormi

on:
  schedule:
    # Cada lunes (3:00 am hora de México): vuelve a buscar fotos libres nuevas
    # (Wikimedia Commons y Flickr) y regenera los wallpapers.
    - cron: "0 9 * * 1"
  push:
    # Al subir imágenes propias a mis_fondos/ se agregan solas al catálogo.
    paths:
      - "mis_fondos/**"
      - "fondos_fuente/**"
  workflow_dispatch:        # manual desde la pestaña Actions
    inputs:
      jugador:
        description: "Limitar a un jugador (vacío = todos)"
        type: choice
        default: ""
        options:
          - ""
          - armando
          - raul
          - quinones
          - mora
          - vasquez
          - gimenez
          - chavez
          - obed
          - fidalgo
          - huescas
          - montes
          - luis_chavez
          - fimbres
          - campillo
          - camberos
          - sandoval
      solo:
        description: "Qué hacer"
        type: choice
        default: ""
        options:
          - ""
          - generar
          - general
          - fotos
          - mios

concurrency:
  group: hormi-fondos   # propio: no compite con el motor de alertas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fondos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main   # siempre lo más nuevo (una corrida en cola, si no, usa la versión de cuando se encoló y repite alertas ya enviadas)

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"

      - name: Instalar Pillow, OpenCV y rembg (recorte del jugador para los pósters)
        run: pip install pillow numpy opencv-contrib-python-headless "rembg[cpu]"

      - name: Generar fondos y buscar fotos libres
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "push" ]; then
            # Al subir fotos: pósters nuevos (fondos_fuente/) y fondos propios (mis_fondos/).
            python hormi_fondos.py --solo generar
            ARGS="--solo mios"
          fi
          if [ -n "${{ inputs.jugador }}" ]; then ARGS="$ARGS --jugador ${{ inputs.jugador }}"; fi
          if [ -n "${{ inputs.solo }}" ]; then ARGS="$ARGS --solo ${{ inputs.solo }}"; fi
          python hormi_fondos.py $ARGS

      - name: Subir fondos
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fondos.json fondos mis_fondos_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiza fondos de pantalla [skip ci]"
            ok=""
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then ok=1; break; fi
              sleep 8
            done
            # si no se pudo subir, la corrida marca error (antes quedaba "success" sin subir nada)
            [ -n "$ok" ] || { echo "No se pudieron subir los fondos"; exit 1; }
          else
            echo "Sin cambios que subir."
          fi
