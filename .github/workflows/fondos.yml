name: Fondos de pantalla - App Hormi

on:
  schedule:
    # Una vez al mes (día 3, 10:00 hora de México): vuelve a buscar fotos
    # libres nuevas en Wikimedia Commons y regenera los wallpapers.
    - cron: "0 16 3 * *"
  workflow_dispatch:        # manual desde la pestaña Actions
    inputs:
      jugador:
        description: "Limitar a un jugador (vacío = todos)"
        type: choice
        default: ""
        options:
          - ""
          - armando
          - raul
          - quinones
          - mora
          - vasquez
          - gimenez
          - chavez
          - obed
          - fidalgo
          - huescas
      solo:
        description: "Qué hacer"
        type: choice
        default: ""
        options:
          - ""
          - generar
          - general
          - fotos

concurrency:
  group: hormi-fondos   # propio: no compite con el motor de alertas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fondos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Pillow
        run: pip install pillow

      - name: Generar fondos y buscar fotos libres
        run: |
          ARGS=""
          if [ -n "${{ inputs.jugador }}" ]; then ARGS="$ARGS --jugador ${{ inputs.jugador }}"; fi
          if [ -n "${{ inputs.solo }}" ]; then ARGS="$ARGS --solo ${{ inputs.solo }}"; fi
          python hormi_fondos.py $ARGS

      - name: Subir fondos
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fondos.json fondos
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiza fondos de pantalla [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          else
            echo "Sin cambios que subir."
          fi
