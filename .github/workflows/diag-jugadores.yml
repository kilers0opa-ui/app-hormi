name: Diag jugadores (temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 diag_jugadores.py > diag_jugadores.json
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      - run: |
          git config user.name bot; git config user.email bot@x
          git add diag_jugadores.json && git commit -m "diag salida [skip ci]" && (git push || (git pull --rebase && git push))
