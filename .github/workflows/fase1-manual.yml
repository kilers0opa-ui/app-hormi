name: Fase 1 - Validar API (manual)

on:
  push:
    paths:
      - ".github/trigger-fase1"
  workflow_dispatch:
    inputs:
      jugador:
        description: "Limitar a un jugador (vacío = todos: armando, raul, quinones, mora, vasquez, gimenez, chavez, obed, fidalgo, huescas)"
        type: choice
        default: ""
        options:
          - ""
          - armando
          - raul
          - quinones
          - mora
          - vasquez
          - gimenez
          - chavez
          - obed
          - fidalgo
          - huescas
      player_id:
        description: "Solo si un jugador no se encontró solo: su id de API-Football (requiere elegir jugador arriba). Vacío = buscarlo automáticamente."
        type: string
        default: ""

concurrency:
  group: hormi-chequeo   # comparte grupo con las demás fases (NO con el motor de alertas, que tiene el suyo: hormi-motor); el push reintenta con pull --rebase
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # siempre lo más nuevo (una corrida en cola, si no, usa la versión de cuando se encoló y repite alertas ya enviadas)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validar API (todos los jugadores y objetivos, o el que se elija)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        # Sin --jugador corre los 5 (armando, raul, quinones, mora, vasquez).
        # Armando ya tiene su player_id guardado en hormi_config.json así que
        # no vuelve a buscarlo por nombre; los demás sí se buscan (y una vez
        # encontrados, quedan guardados para las siguientes corridas).
        run: |
          if [ -n "${{ inputs.jugador }}" ]; then
            if [ -n "${{ inputs.player_id }}" ]; then
              python hormiga_fase1_validar_api.py --jugador "${{ inputs.jugador }}" --player-id "${{ inputs.player_id }}"
            else
              python hormiga_fase1_validar_api.py --jugador "${{ inputs.jugador }}"
            fi
          else
            python hormiga_fase1_validar_api.py
          fi

      - name: Subir hormi_config.json y resultado_fase1.json
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hormi_config.json resultado_fase1.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiza team_id detectados (Fase 1) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          else
            echo "Sin cambios que subir."
          fi
