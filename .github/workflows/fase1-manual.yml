name: Fase 1 - Validar API (manual)

on:
  push:
    paths:
      - ".github/trigger-fase1"
  workflow_dispatch:
    inputs:
      jugador:
        description: "Limitar a un jugador (vacío = todos: armando, raul, quinones)"
        type: choice
        default: ""
        options:
          - ""
          - armando
          - raul
          - quinones

concurrency:
  group: hormi-chequeo   # mismo grupo que el motor: nunca corren al mismo tiempo (evita choques de git push)
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validar API (todos los jugadores y objetivos, o el que se elija)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        # Sin --jugador corre los 3 (armando, raul, quinones). Armando ya
        # tiene su player_id guardado en hormi_config.json así que no
        # vuelve a buscarlo por nombre; raul y quinones sí se buscan (y una
        # vez encontrados, quedan guardados para las siguientes corridas).
        run: |
          if [ -n "${{ inputs.jugador }}" ]; then
            python hormiga_fase1_validar_api.py --jugador "${{ inputs.jugador }}"
          else
            python hormiga_fase1_validar_api.py
          fi

      - name: Subir hormi_config.json y resultado_fase1.json
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hormi_config.json resultado_fase1.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiza team_id detectados (Fase 1) [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "Sin cambios que subir."
          fi
