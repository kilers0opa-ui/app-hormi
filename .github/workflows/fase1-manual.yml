name: Fase 1 - Validar API (manual)

on:
  push:
    paths:
      - ".github/trigger-fase1"
  workflow_dispatch: {}

concurrency:
  group: hormi-chequeo   # mismo grupo que el motor: nunca corren al mismo tiempo (evita choques de git push)
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validar API (todos los targets)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        # --player-id fijo: ya sabemos el id global de la Hormiga (291713),
        # así nos ahorramos la búsqueda por nombre (que puede fallar si la
        # API no cubre la temporada) y siempre siguen goles/asistencias/etc.
        run: python hormiga_fase1_validar_api.py --player-id 291713

      - name: Subir hormi_config.json y resultado_fase1.json
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hormi_config.json resultado_fase1.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiza team_id detectados (Fase 1) [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "Sin cambios que subir."
          fi
