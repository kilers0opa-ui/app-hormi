name: Fase 1 - Validar API (manual)

on:
  push:
    paths:
      - ".github/trigger-fase1"
  workflow_dispatch: {}

concurrency:
  group: hormi-fase1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validar API (todos los targets)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python hormiga_fase1_validar_api.py

      - name: Subir hormi_config.json y resultado_fase1.json
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hormi_config.json resultado_fase1.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiza team_id detectados (Fase 1) [skip ci]"
            git push
          else
            echo "Sin cambios que subir."
          fi
