name: Agenda de la semana - App Hormi

on:
  schedule:
    # Cada 4 h (:35): ~14 peticiones por corrida (1 por equipo).
    - cron: "35 */4 * * *"
  workflow_dispatch:

concurrency:
  group: hormi-agenda
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  agenda:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install google-auth requests
      - name: Armar la agenda
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
                  run: python hormi_agenda.py
      - name: Subir resultado
        if: ${{ !cancelled() }}
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add agenda.json 2>/dev/null || true
          git commit -m "chore: agenda de la semana [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin main && git push && break; sleep 5; done
