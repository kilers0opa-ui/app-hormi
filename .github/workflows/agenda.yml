name: Agenda de la semana - App Hormi

on:
  schedule:
    # Cada 15 min: si hay partidos en juego refresca solo esos (1 petición); cada 4 h hace la corrida completa
    # (~14 peticiones, 1 por equipo). Sin partidos en juego no gasta nada.
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "rapida | completa | auto"
        required: false
        default: "auto"

concurrency:
  group: hormi-agenda
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  agenda:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Armar la agenda
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python hormi_agenda.py --${{ inputs.modo || 'auto' }}
      - name: Subir resultado
        if: ${{ !cancelled() }}
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add agenda.json 2>/dev/null || true
          git commit -m "chore: agenda de la semana [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin main && git push && break; sleep 5; done
