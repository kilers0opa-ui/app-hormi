name: Disponibilidad (lesiones y suspensiones) - App Hormi

on:
  schedule:
    # Cada 3 h (:40): ~26 peticiones por corrida. Así una baja se quita pronto cuando el jugador vuelve a la lista.
    - cron: "40 */3 * * *"
  push:
    # Al editar las bajas a mano se aplica de inmediato.
    paths:
      - "bajas_manual.json"
  workflow_dispatch:
    inputs:
      sin_avisos:
        description: "true = corrige sin mandar notificaciones"
        required: false
        default: "false"

concurrency:
  group: hormi-disponibilidad
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  disponibilidad:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Revisar lesiones y suspensiones
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: python hormi_disponibilidad.py ${{ inputs.sin_avisos == 'true' && '--sin-avisos' || '' }}
      - name: Subir resultado
        if: ${{ !cancelled() }}
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add disponibilidad.json bajas_manual.json amarillas_cache.json 2>/dev/null || true
          git commit -m "chore: disponibilidad [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin main && git push && break; sleep 5; done
