name: Prueba de push de todos los tipos - App Hormi

on:
  workflow_dispatch:
    inputs:
      jugador:
        description: "Reenviar solo a este jugador (vacío = todos)"
        default: ""
      equipo:
        description: "'seleccion' = el push lleva el objetivo de la Selección (vacío = club)"
        default: ""
      tipo:
        description: "Solo este tipo (goal, assist, lineup, start, sub, final, incident, transfer, video); vacío = todos"
        default: ""

concurrency:
  group: hormi-prueba-push   # propio: no espera al motor ni lo estorba
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prueba:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main   # siempre lo más nuevo (una corrida en cola, si no, usa la versión de cuando se encoló y repite alertas ya enviadas)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Mandar los push de prueba
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          SOLO_JUGADOR: ${{ inputs.jugador }}
          SOLO_TIPO: ${{ inputs.tipo }}
          SOLO_EQUIPO: ${{ inputs.equipo }}
        run: python prueba_push_todos.py
      - name: Subir resultado
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prueba_push.json
          git commit -m "chore: resultado de la prueba de push [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
