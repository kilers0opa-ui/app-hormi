name: Revisión de partidos recientes - App Hormi

on:
  schedule:
    # Cada 4 h (:50): vuelve a leer el último partido de cada jugador si fue en los últimos 3 días
    # (1 petición por corrida) por si la API corrigió un gol, asistencia o marcador.
    - cron: "50 * * * *"   # cada hora (correcciones de goles y tarjeta del partido al día)
  workflow_dispatch:
    inputs:
      recalcular:
        description: "Recalcular la calificación del último partido de estos jugadores (coma), aunque ya esté fija"
        type: string
        default: ""

concurrency:
  group: hormi-revision
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Revisar correcciones de la API
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: python hormi_revision.py ${{ inputs.recalcular && format('--recalcular {0}', inputs.recalcular) || '' }}
      - name: Subir resultado
        if: ${{ !cancelled() }}
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add player_stats.json revision.json tarjetas 2>/dev/null || true
          git commit -m "chore: revisión de partidos recientes [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin main && git push && break; sleep 5; done
