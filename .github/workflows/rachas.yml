name: Rachas e hitos - App Hormi

on:
  schedule:
    # Cada hora: ~13 peticiones (1 por equipo) + 1 por partido terminado nuevo. Los avisos de racha/hito
    # llegan a más tardar ~1 h después del final.
    - cron: "20 * * * *"
  workflow_dispatch:   # también lo lanza el motor al terminar un partido (con "esperar" para que ya esté subido el historial)
    inputs:
      esperar:
        description: "Segundos a esperar antes de leer el repo"
        type: string
        default: "0"

concurrency:
  group: hormi-rachas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rachas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Esperar
        run: sleep "${{ inputs.esperar || '0' }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Calcular rachas e hitos
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: python hormi_rachas.py
      - name: Subir resultado
        if: ${{ !cancelled() }}
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rachas.json rachas_cache.json 2>/dev/null || true
          git commit -m "chore: rachas e hitos [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin main && git push && break; sleep 5; done
