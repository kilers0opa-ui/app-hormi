name: Noticias - App Hormi

on:
  schedule:
    # Dos veces al día, en horarios distintos a los de las demás fases
    # (tabla 12:00 UTC, transferencias 15:00 UTC, historial 09:00 UTC).
    # Solo noticias (RSS de Google Noticias): NO gasta cuota de YouTube. Los
    # videos llegan por eventos (goles y finales) en video-gol.yml.
    - cron: "30 17 * * *"   # 11:30 hora de México (UTC-6)
    - cron: "30 1 * * *"    # 19:30 hora de México
  workflow_dispatch:        # para poder correrlo manual desde la pestaña Actions
    inputs:
      jugador:
        description: "Limitar a un jugador (vacío = todos: armando, raul, quinones, mora, vasquez, gimenez, chavez, obed, fidalgo, huescas)"
        type: choice
        default: ""
        options:
          - ""
          - armando
          - raul
          - quinones
          - mora
          - vasquez
          - gimenez
          - chavez
          - obed
          - fidalgo
          - huescas

concurrency:
  group: hormi-videos   # PROPIO de este workflow: nunca comparte cola con el motor de alertas (hormi-chequeo), así una corrida de videos jamás puede retrasar una alerta de gol
  cancel-in-progress: false

permissions:
  contents: write   # necesario para que el workflow pueda hacer commit/push de videos.json

jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # siempre lo más nuevo (una corrida en cola, si no, usa la versión de cuando se encoló y repite alertas ya enviadas)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Actualizar noticias (videos.json)
        run: |
          ARGS=""
          if [ -n "${{ inputs.jugador }}" ]; then
            ARGS="$ARGS --jugador ${{ inputs.jugador }}"
          fi
          python hormi_videos.py $ARGS

      - name: Subir videos.json
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add videos.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiza noticias (Fase 6) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          else
            echo "Sin cambios que subir."
          fi
