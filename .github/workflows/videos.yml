name: Noticias - App Hormi

on:
  schedule:
    # Tres veces al día (mediodía, tarde y noche de México, para cubrir la mañana europea y la noche
    # mexicana). Solo noticias (RSS de Google Noticias): NO gasta cuota de YouTube; la traducción (Azure)
    # solo traduce titulares nuevos (caché). Los videos llegan por eventos en video-gol.yml.
    # Unos minutos antes de la hora en punto: a las :00 GitHub suele retrasar las corridas.
    - cron: "52 17 * * *"   # 11:52 hora de México (UTC-6)
    - cron: "52 22 * * *"   # 16:52 hora de México
    - cron: "52 3 * * *"    # 21:52 hora de México
  workflow_dispatch:        # para poder correrlo manual desde la pestaña Actions
    inputs:
      jugador:
        description: "Limitar a un jugador (vacío = todos: armando, raul, quinones, mora, vasquez, gimenez, chavez, obed, fidalgo, huescas, montes, luis_chavez, fimbres, campillo, camberos, sandoval)"
        type: choice
        default: ""
        options:
          - ""
          - armando
          - raul
          - quinones
          - mora
          - vasquez
          - gimenez
          - chavez
          - obed
          - fidalgo
          - huescas
          - montes
          - luis_chavez
          - fimbres
          - campillo
          - camberos
          - sandoval

concurrency:
  group: hormi-videos   # PROPIO de este workflow: nunca comparte cola con el motor de alertas (hormi-chequeo), así una corrida de videos jamás puede retrasar una alerta de gol
  cancel-in-progress: false

permissions:
  contents: write   # necesario para que el workflow pueda hacer commit/push de videos.json

jobs:
  videos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: main   # siempre lo más nuevo (una corrida en cola, si no, usa la versión de cuando se encoló y repite alertas ya enviadas)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Actualizar noticias (videos.json)
        env:
          # Traducción de la prensa local (Azure Translator). Sin estos secretos se omite esa noticia.
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.jugador }}" ]; then
            ARGS="$ARGS --jugador ${{ inputs.jugador }}"
          fi
          python hormi_videos.py $ARGS

      - name: Subir videos.json
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add videos.json
          [ -f traducciones_cache.json ] && git add traducciones_cache.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiza noticias (Fase 6) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          else
            echo "Sin cambios que subir."
          fi
