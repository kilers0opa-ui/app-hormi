name: Motor de alertas - App Hormi

on:
  schedule:
    # Cada 5 minutos. Es barato: si no hay partido cerca, el script no
    # gasta ninguna petición de la API (ver hormi_alertas.py, modo chequeo).
    - cron: "*/5 * * * *"
  workflow_dispatch:       # para poder correrlo manual desde la pestaña Actions
    inputs:
      modo:
        description: "chequeo (normal) o prueba (manda un push de prueba por ntfy y FCM)"
        type: choice
        default: chequeo
        options:
          - chequeo
          - prueba

concurrency:
  group: hormi-chequeo
  cancel-in-progress: false   # nunca corta una corrida a medias

permissions:
  contents: write   # necesario para que el workflow pueda hacer commit/push del estado

jobs:
  chequeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias (push real vía FCM)
        run: pip install google-auth

      - name: Chequeo
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: python hormi_alertas.py "${{ inputs.modo || 'chequeo' }}"

      - name: Guardar estado (status.json, hormi_estado.json, hormi_horario.json)
        if: ${{ (inputs.modo || 'chequeo') == 'chequeo' }}
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.json hormi_estado.json hormi_horario.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiza estado del chequeo [skip ci]"
            # Por si otro workflow (fase1-manual) subió algo justo antes:
            git pull --rebase origin main
            git push
          else
            echo "Sin cambios que subir."
          fi
