name: Motor de alertas - App Hormi

on:
  schedule:
    # El cron de GitHub NO es puntual: pedir "cada 5 min" en la práctica corre
    # cada ~20-30 min (medido). Por eso el modo "vigilar": cuando hay un partido
    # en curso o por empezar, UNA corrida se queda viva y revisa cada minuto
    # (ver hormi_alertas.py). Este cron solo es el arranque y la red de
    # seguridad. Si no hay partido cerca, la corrida hace una pasada y sale.
    - cron: "*/5 * * * *"
  workflow_dispatch:       # para poder correrlo manual desde la pestaña Actions
    inputs:
      modo:
        description: "vigilar (normal) · chequeo (una sola pasada) · prueba (push de prueba; ntfy está apagado, solo FCM)"
        type: choice
        default: vigilar
        options:
          - vigilar
          - chequeo
          - prueba

# GRUPO PROPIO: una corrida "vigilar" puede durar horas. Si compartiera grupo
# con historial/tabla/transferencias/fase1 (grupo hormi-chequeo), las dejaría
# esperando todo el partido, y como GitHub solo guarda UNA corrida pendiente
# por grupo, las programadas se cancelarían. Los choques de git se manejan con
# pull --rebase + reintentos (aquí y en esos workflows).
concurrency:
  group: hormi-motor
  cancel-in-progress: false   # nunca corta una corrida a medias

permissions:
  contents: write   # necesario para que el workflow pueda hacer commit/push del estado
  actions: write    # para lanzar la revisión de bajas al terminar un partido (disponibilidad.yml)

jobs:
  chequeo:
    runs-on: ubuntu-24.04
    timeout-minutes: 350   # un poco más que MAX_VIGILAR (5 h 40 min) de hormi_alertas.py
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: main   # siempre lo más nuevo (una corrida en cola, si no, usa la versión de cuando se encoló y repite alertas ya enviadas)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Instalar dependencias (push real vía FCM)
        run: pip install -r requirements.txt

      - name: Configurar git
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Motor
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          # En modo vigilar el script sube el estado a git él mismo en cada pasada con novedades.
          HORMI_GIT_PUSH: "1"
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}          # alineación de respaldo (hormi_gemini.py)
          SOPORTE_SMTP_USER: ${{ secrets.SOPORTE_SMTP_USER }}    # correo a soporte si la alineación no coincide
          SOPORTE_SMTP_PASS: ${{ secrets.SOPORTE_SMTP_PASS }}
        run: python hormi_alertas.py "${{ inputs.modo || 'vigilar' }}"

      - name: Guardar estado (status.json, hormi_estado.json, hormi_horario.json, player_stats.json)
        # !cancelled(): también si el motor salió con error, para no perder lo ya avisado.
        if: ${{ !cancelled() && (inputs.modo || 'vigilar') != 'prueba' }}
        run: |
          git add status.json hormi_estado.json hormi_horario.json player_stats.json
          git add tarjetas tarjetas_estado.json gemini_alineaciones.json 2>/dev/null || true
          # Solo existe después del primer gol alertado. Protegido con '|| true' para que,
          # pase lo que pase con este archivo, el guardado del estado de las alertas nunca falle por él.
          [ -f videos_pendientes.json ] && git add videos_pendientes.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiza estado del chequeo [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          else
            echo "Sin cambios que subir."
          fi
