name: DEBUG temporal - un solo uso

on:
  workflow_dispatch:

concurrency:
  group: hormi-chequeo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Volcar respuesta cruda
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python _debug_dump.py
      - name: Subir resultado
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _debug_raw.json
          git commit -m "debug: volcado temporal [skip ci]"
          git pull --rebase origin main
          git push
