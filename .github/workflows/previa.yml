name: Previa del partido - App Hormi

on:
  schedule:
    # Cada 2 h (:45): 3 peticiones por partido nuevo de las próximas 30 h (una vez por partido).
    - cron: "45 */2 * * *"
  workflow_dispatch:

concurrency:
  group: hormi-previa
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  previa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Armar la previa
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python hormi_previa.py
      - name: Subir resultado
        if: ${{ !cancelled() }}
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add previa.json 2>/dev/null || true
          git commit -m "chore: previa [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin main && git push && break; sleep 5; done
