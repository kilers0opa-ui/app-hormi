name: Deteccion de cambio de equipo - App Hormi

on:
  schedule:
    # El cron corre TODOS los días 09:00 hora de México (UTC-6), pero el paso
    # "Decidir si toca revisar" (abajo) solo deja pasar:
    #   - los días 1 y 16 de cada mes (≈ una vez cada 15 días), y
    #   - TODOS los días dentro de las ventanas de fichajes: del 1-dic al
    #     10-feb (Liga MX en diciembre, Europa/Arabia en enero) y del 1-jun al
    #     5-sep (verano). Así pasa a diario solo cuando importa, sin tocar
    #     nada a mano. Si cambian las fechas, se editan en ese paso.
    # Corrido manual (Run workflow) siempre revisa.
    - cron: "0 15 * * *"
  workflow_dispatch:       # para poder correrlo manual desde la pestaña Actions
    inputs:
      jugador:
        description: "Limitar a un jugador (vacío = todos: armando, raul, quinones, mora, vasquez, gimenez, chavez, obed, fidalgo, huescas)"
        type: choice
        default: ""
        options:
          - ""
          - armando
          - raul
          - quinones
          - mora
          - vasquez
          - gimenez
          - chavez
          - obed
          - fidalgo
          - huescas
      backfill_crests:
        description: "Solo rellenar escudos faltantes (crest_url), sin revisar transferencias"
        type: boolean
        default: false

concurrency:
  group: hormi-chequeo   # comparte grupo con las demás fases (NO con el motor de alertas, que tiene el suyo: hormi-motor); el push reintenta con pull --rebase
  cancel-in-progress: false

permissions:
  contents: write   # necesario para que el workflow pueda hacer commit/push de hormi_config.json

jobs:
  transferencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # siempre lo más nuevo (una corrida en cola, si no, usa la versión de cuando se encoló y repite alertas ya enviadas)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias (push real vía FCM)
        run: pip install google-auth requests

      - name: Decidir si toca revisar
        id: gate
        run: |
          # Fecha en hora de México (el runner va en UTC; MX no tiene horario de verano).
          MD=$(TZ=America/Mexico_City date +%m%d)    # p.ej. 1201
          DAY=$(TZ=America/Mexico_City date +%d)
          RUN=false
          if [ "${{ github.event_name }}" != "schedule" ]; then RUN=true; echo "Corrida manual: se revisa."
          elif [ "$DAY" = "01" ] || [ "$DAY" = "16" ]; then RUN=true; echo "Día $DAY: toca la revisión quincenal."
          elif [ "$MD" -ge 1201 ] || [ "$MD" -le 0210 ]; then RUN=true; echo "Ventana de fichajes de invierno: revisión diaria."
          elif [ "$MD" -ge 0601 ] && [ "$MD" -le 0905 ]; then RUN=true; echo "Ventana de fichajes de verano: revisión diaria."
          else echo "Fuera de ventana y no es día 1/16: no se gastan peticiones hoy."
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Revisar cambios de equipo / rellenar escudos
        if: steps.gate.outputs.run == 'true'
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ inputs.backfill_crests }}" = "true" ]; then
            python hormi_transferencias.py --backfill-crests
          elif [ -n "${{ inputs.jugador }}" ]; then
            python hormi_transferencias.py --jugador "${{ inputs.jugador }}"
          else
            python hormi_transferencias.py
          fi

      - name: Subir hormi_config.json
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hormi_config.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiza equipo/escudo detectado (Fase 5) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          else
            echo "Sin cambios que subir."
          fi
