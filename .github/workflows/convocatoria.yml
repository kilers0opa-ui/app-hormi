name: Convocatoria de la Seleccion - App Hormi

on:
  schedule:
    # Dos veces al día (la lista se anuncia con días de anticipación).
    - cron: "15 14 * * *"
    - cron: "15 2 * * *"
  workflow_dispatch:

concurrency:
  group: hormi-chequeo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  convocatoria:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: main   # siempre lo más nuevo (una corrida en cola, si no, usa la versión de cuando se encoló y repite alertas ya enviadas)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Leer la convocatoria (Wikipedia en inglés y en español)
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: python hormi_convocatoria.py

      - name: Subir hormi_convocatoria.json
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hormi_convocatoria.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiza convocatoria de la Selección [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          else
            echo "Sin cambios que subir."
          fi
