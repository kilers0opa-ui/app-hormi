name: Convocatoria de la Seleccion - App Hormi

on:
  schedule:
    # Dos veces al día (la lista se anuncia con días de anticipación).
    - cron: "15 14 * * *"
    - cron: "15 2 * * *"
  workflow_dispatch:

concurrency:
  group: hormi-chequeo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  convocatoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Leer la convocatoria (Wikipedia)
        run: python hormi_convocatoria.py

      - name: Subir hormi_convocatoria.json
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hormi_convocatoria.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiza convocatoria de la Selección [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          else
            echo "Sin cambios que subir."
          fi
