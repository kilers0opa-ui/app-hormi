name: Diagnóstico de partido - App Hormi

on:
  workflow_dispatch:

concurrency:
  group: hormi-diag-fixture   # propio: no espera al motor ni lo estorba
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: main   # siempre lo más nuevo (una corrida en cola, si no, usa la versión de cuando se encoló y repite alertas ya enviadas)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Mandar mensaje de prueba y guardar resultado
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python diag_fixture.py
      - name: Subir resultado
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diag_fixture.json
          git commit -m "chore: resultado del diagnóstico de push [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
