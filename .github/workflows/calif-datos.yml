name: Datos para la Calificacion Legion MX - App Hormi

# hormi_calif_datos.py: estadísticas de todos los jugadores de los últimos partidos de nuestros equipos, para
# diseñar y calibrar nuestra propia calificación por posición. Una vez por semana (lunes 04:10 CDMX) y manual.
on:
  schedule:
    - cron: "10 10 * * 1"
  workflow_dispatch:
    inputs:
      ultimos:
        description: "Últimos N partidos por equipo"
        type: string
        default: "15"

concurrency:
  group: hormi-calif-datos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  datos:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Juntar estadísticas
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python hormi_calif_datos.py --ultimos "${{ inputs.ultimos || '15' }}"
          python hormi_calif_legion.py --calibrar   # re-ajusta la escala por posición con los datos nuevos
      - name: Subir resultado
        if: ${{ !cancelled() }}
        run: |
          git config user.name "app-hormi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add calif_datos.json calif_calibracion.json 2>/dev/null || true
          git commit -m "chore: datos para la calificación Legión MX [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin main && git push && break; sleep 5; done
